name: Build and Deploy Flutter Web to Vercel

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.16.0'
        channel: 'stable'
        cache: true
    
    - name: Flutter doctor
      run: flutter doctor -v
    
    - name: Install dependencies
      run: flutter pub get
    
    - name: Clean build
      run: flutter clean
    
    - name: Build web (release)
      run: flutter build web --release --web-renderer html --base-href /
    
    - name: List build output
      run: ls -la build/web/
    
    - name: Verify main.dart.js exists
      run: |
        if [ ! -f "build/web/main.dart.js" ]; then
          echo "ERROR: main.dart.js not found in build/web/"
          exit 1
        else
          echo "✓ main.dart.js found"
          ls -la build/web/main.dart.js
        fi
    
    - name: Deploy to Vercel
      uses: amondnet/vercel-action@v25
      with:
        vercel-token: ${{ secrets.VERCEL_TOKEN }}
        vercel-org-id: ${{ secrets.ORG_ID }}
        vercel-project-id: ${{ secrets.PROJECT_ID }}
        working-directory: ./build/web
        vercel-args: '--prod --confirm'